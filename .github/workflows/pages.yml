# Publishes the site to GitHub Pages on every push to main or to the working branch (portada-video),
# so the public link always matches the local preview (requested by Carlos, 3-nov-2026).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, portada-video]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar y verificar el sitio
        run: |
          node build.mjs
          node check.mjs
      - name: Preparar rutas para GitHub Pages
        run: node prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
