<!doctype html><meta charset=utf-8><title>Movil</title>
<style>body{margin:0;background:#333;display:flex;gap:14px;padding:10px;align-items:flex-start}iframe{width:390px;height:844px;border:0;background:#fff;flex:none}</style>
<body><script>
addEventListener("DOMContentLoaded", () => {
const P = new URLSearchParams(location.search);
const pages = (P.get('p') || '/oficinas/uruguay/').split(',');
const offs = (P.get('y') || '0').split(',').map(Number);
for (const p of pages) for (const y of offs) {
  const f = document.createElement('iframe'); f.src = p;
  f.onload = () => f.contentWindow.scrollTo(0, y);
  document.body.appendChild(f);
}
});
</script>
