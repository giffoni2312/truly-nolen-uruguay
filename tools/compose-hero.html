<!doctype html>
<meta charset="utf-8">
<title>Compose hero</title>
<style>body{margin:0;background:#222}canvas{max-width:100%;display:block}</style>
<canvas id="c"></canvas>
<script>
// Puts the Truly car + road from the Venezuela hero over a Uruguayan background.
// Keep = everything below the road horizon (road, verge) + car-colored pixels inside a loose hull
// around the car (yellow body, dark windows/ears/tyres). Holes are closed and edges feathered.
const load = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? +P.get(k) : d);

// Coordinates in the 1920x1204 template
const HORIZON = [[0, 600], [250, 520], [560, 560], [900, 640], [1250, 700], [1600, 760], [1920, 800]];
const HULL = [[1105, 395], [1440, 400], [1530, 545], [1625, 640], [1712, 760], [1715, 990], [1590, 1010], [905, 960], [895, 760], [960, 610], [1040, 560], [1110, 530]];

function inPoly(x, y, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; }
function horizonAt(x) { for (let i = 1; i < HORIZON.length; i++) { const [x0, y0] = HORIZON[i - 1], [x1, y1] = HORIZON[i]; if (x <= x1) return y0 + ((y1 - y0) * (x - x0)) / (x1 - x0); } return HORIZON.at(-1)[1]; }
function isCarColor(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const yellow = r > 140 && g > 90 && b < r - 45 && g > b && r >= g * 0.95; // yellow/orange paint, lit or shaded
  const dark = mx < 85 && mx - mn < 40 && !(g > r + 12 && g > b + 8);        // windows, ears, tyres (not dark foliage)
  const chrome = mx > 150 && mx - mn < 30 && b < 200;                         // trim, headlight rims
  const red = r > 150 && g < 90 && b < 90;                                    // nose
  return yellow || dark || chrome || red;
}

window.compose = async function () {
  const [ve, bg] = await Promise.all([
    load('/oficinas/venezuela/assets/venezuela-desktop.webp'),
    load('/_tools/out/' + (P.get('bg') || 'uy-fondo-rambla-punta-del-este.jpg')),
  ]);
  const W = ve.naturalWidth, H = ve.naturalHeight;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  const k = new OffscreenCanvas(W, H).getContext('2d'); k.drawImage(ve, 0, 0);
  const a = k.getImageData(0, 0, W, H).data;

  // Tight car silhouette traced on the template + the two ears as circles
  const CAR = [[898, 780], [919, 714], [977, 639], [1012, 600], [1044, 572], [1080, 552], [1118, 539], [1270, 534], [1417, 534], [1452, 570], [1484, 614], [1530, 636], [1550, 656], [1633, 705], [1686, 772], [1703, 863], [1699, 929], [1650, 971], [1152, 1012], [919, 929], [894, 863]];
  const EARS = [[1182, 478, num('er', 63)], [1354, 485, num('er', 63) - 2]];
  const inCar = (x, y) => inPoly(x, y, CAR) || EARS.some(([cx, cy, r]) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r);
  let m = new Float32Array(W * H);
  const tight = new Float32Array(W * H);
  for (let y = 300; y < H; y++) for (let x = 850; x < 1760; x++) if (inCar(x, y)) tight[y * W + x] = 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (y > horizonAt(x) || tight[i]) m[i] = 1; }
  // Refine the edge: within a 14 px band around the silhouette, keep yellow/dark car pixels
  const band = (() => { const r = 14, out = new Float32Array(W * H), tmp = new Float32Array(W * H);
    for (let y = 0; y < H; y++) { let s = 0; const row = y * W; for (let x = -r; x <= r; x++) s += tight[row + Math.min(W - 1, Math.max(0, x))]; for (let x = 0; x < W; x++) { tmp[row + x] = s; s += tight[row + Math.min(W - 1, x + r + 1)] - tight[row + Math.max(0, x - r)]; } }
    for (let x = 0; x < W; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[Math.min(H - 1, Math.max(0, y)) * W + x]; for (let y = 0; y < H; y++) { out[y * W + x] = s; s += tmp[Math.min(H - 1, y + r + 1) * W + x] - tmp[Math.max(0, y - r) * W + x]; } }
    return out; })();
  for (let i = 0; i < W * H; i++) if (!tight[i] && band[i] > 0) { const r = a[i * 4], gg = a[i * 4 + 1], b = a[i * 4 + 2]; const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b); const y = Math.floor(i / W); if ((r > 140 && gg > 90 && b < r - 45 && y > 545) || (mx < 70 && mx - mn < 30 && y > 760)) m[i] = 1; }
  // Pull the edge 2 px inside the tight silhouette where the pixel is clearly background (sky/foliage/sea)
  for (let i = 0; i < W * H; i++) if (tight[i] && band[i] < (29 * 29) * 0.9) { const r = a[i * 4], gg = a[i * 4 + 1], b = a[i * 4 + 2]; if ((gg > r + 10 && gg > b) || (b > r + 15) || (r > 200 && gg > 180 && b > 170)) m[i] = 0; }
  const blur = (src, r) => {
    const out = new Float32Array(W * H), tmp = new Float32Array(W * H);
    for (let y = 0; y < H; y++) { let s = 0; const row = y * W; for (let x = -r; x <= r; x++) s += src[row + Math.min(W - 1, Math.max(0, x))]; for (let x = 0; x < W; x++) { tmp[row + x] = s / (2 * r + 1); s += src[row + Math.min(W - 1, x + r + 1)] - src[row + Math.max(0, x - r)]; } }
    for (let x = 0; x < W; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[Math.min(H - 1, Math.max(0, y)) * W + x]; for (let y = 0; y < H; y++) { out[y * W + x] = s / (2 * r + 1); s += tmp[Math.min(H - 1, y + r + 1) * W + x] - tmp[Math.max(0, y - r) * W + x]; } }
    return out;
  };
  // drop isolated specks, then feather the edge
  const t = blur(m, 2); for (let i = 0; i < m.length; i++) m[i] = t[i] > 0.5 ? 1 : 0;
  m = blur(m, num('feather', 2));

  // background cover-fit; its horizon aligned to the template horizon on the left side
  const bgH = num('bh', 0.63), target = num('h', 0.5), focus = num('bx', 0.6);
  const scale = num('zoom', 1) * Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
  const bw = bg.naturalWidth * scale, bh = bg.naturalHeight * scale;
  const dy = Math.min(0, Math.max(H - bh, H * target - bgH * bh));
  const dx = Math.min(0, Math.max(W - bw, W / 2 - focus * bw));
  g.drawImage(bg, dx, dy, bw, bh);
  g.globalCompositeOperation = 'soft-light'; g.fillStyle = `rgba(255,165,85,${num('warm', 0.35)})`; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';

  const out = g.getImageData(0, 0, W, H), o = out.data;
  for (let i = 0; i < W * H; i++) { const v = m[i]; if (v <= 0) continue; for (let ch = 0; ch < 3; ch++) o[i * 4 + ch] = o[i * 4 + ch] * (1 - v) + a[i * 4 + ch] * v; }
  g.putImageData(out, 0, 0);
  if (P.has('debug')) { g.strokeStyle = '#f0f'; g.lineWidth = 3; g.beginPath(); HULL.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.stroke(); g.strokeStyle = '#0ff'; g.beginPath(); HORIZON.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); }
  return { W, H };
};
window.save = async function (name, q = 0.9) {
  const blob = await new Promise((r) => document.getElementById('c').toBlob(r, 'image/jpeg', q));
  return (await fetch('/_save/' + name, { method: 'POST', body: blob })).status + ' ' + blob.size;
};
compose().then((r) => { document.title = 'ready ' + r.W + 'x' + r.H; });
</script>
