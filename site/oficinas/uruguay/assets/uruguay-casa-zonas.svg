<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img">
  <!-- Top-down view of a Montevideo "casa estándar" on a narrow lot between party walls:
       front rooms, skylight patio, back yard (fondo) with parrillero. -->
  <rect width="1200" height="1200" fill="#f7f6f1"/>

  <!-- street (vereda + calle) -->
  <rect x="0" y="1060" width="1200" height="140" fill="#cfcac0"/>
  <rect x="0" y="1120" width="1200" height="80" fill="#8d9196"/>
  <g fill="#7f9a52"><circle cx="200" cy="1090" r="34"/><circle cx="1000" cy="1090" r="34"/></g>

  <!-- neighbouring houses (medianeras) -->
  <rect x="0" y="80" width="300" height="980" fill="#e6e1d6"/>
  <rect x="900" y="80" width="300" height="980" fill="#e6e1d6"/>

  <!-- PERIMETER: lot outline (yellow) -->
  <rect x="300" y="80" width="600" height="980" fill="none" stroke="#f6c200" stroke-width="22"/>

  <!-- GREEN: fondo (back yard) -->
  <rect x="320" y="100" width="560" height="300" fill="#3f9b4a" opacity=".85"/>
  <g fill="#2f7a39">
    <circle cx="400" cy="180" r="44"/><circle cx="470" cy="300" r="30"/><circle cx="820" cy="170" r="34"/>
  </g>
  <!-- parrillero -->
  <rect x="700" y="290" width="140" height="70" fill="#a65a3b"/>
  <rect x="720" y="305" width="100" height="40" fill="#4a3329"/>

  <!-- RED: interior rooms around the skylight patio -->
  <g fill="#e1262d" opacity=".88">
    <rect x="320" y="420" width="560" height="160"/>  <!-- cocina + baño -->
    <rect x="320" y="580" width="180" height="260"/>  <!-- dormitorio -->
    <rect x="700" y="580" width="180" height="260"/>  <!-- dormitorio -->
    <rect x="320" y="860" width="560" height="180"/>  <!-- living + zaguán -->
  </g>
  <!-- patio with claraboya (skylight) -->
  <rect x="510" y="590" width="180" height="250" fill="#f2d7d3"/>
  <g stroke="#ffffff" stroke-width="4" fill="none" opacity=".9">
    <rect x="530" y="610" width="140" height="210"/>
    <path d="M530 680h140M530 750h140M600 610v210"/>
  </g>

  <!-- walls between rooms -->
  <g stroke="#7a1418" stroke-width="6">
    <path d="M320 580h560M320 850h560M500 580v270M700 580v270M600 420v160M600 860v180"/>
  </g>
  <!-- front door (zaguán) -->
  <rect x="560" y="1036" width="80" height="20" fill="#2f3a40"/>
</svg>
