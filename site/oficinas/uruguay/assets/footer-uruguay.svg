<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 768">
  <!-- Watercolor-style footer of the SAME place as the hero (recipe step 7): the Rambla of Punta del Este,
       its towers, the sea, La Mano (Los Dedos) on Playa Brava, maritime pines and the classic Truly beetle. -->
  <defs>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .07 0"/></filter>
    <radialGradient id="fade" cx=".5" cy=".55" r=".62"><stop offset=".72" stop-color="#f7f6f1" stop-opacity="0"/><stop offset="1" stop-color="#f7f6f1"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f6f1"/><stop offset=".6" stop-color="#f6ead6"/><stop offset="1" stop-color="#f1dcc2"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c3c9"/><stop offset="1" stop-color="#8fb0b8"/></linearGradient>
  </defs>
  <rect width="1536" height="768" fill="#f7f6f1"/>
  <g filter="url(#wc)">
    <rect x="70" y="150" width="1396" height="430" fill="url(#sky)"/>

    <!-- Punta del Este towers along the Rambla (left and center background) -->
    <g fill="#ece4d6" stroke="#c9bba3" stroke-width="2">
      <rect x="180" y="250" width="70" height="210"/><rect x="262" y="210" width="80" height="250"/>
      <rect x="360" y="270" width="62" height="190"/><rect x="438" y="190" width="88" height="270"/>
      <rect x="540" y="300" width="60" height="160"/><rect x="618" y="240" width="74" height="220"/>
    </g>
    <g stroke="#d6cab4" stroke-width="2" opacity=".9">
      <path d="M190 280h50M190 310h50M190 340h50M190 370h50M190 400h50M272 240h60M272 270h60M272 300h60M272 330h60M272 360h60M272 390h60M448 220h68M448 250h68M448 280h68M448 310h68M448 340h68M448 370h68M448 400h68M628 270h54M628 300h54M628 330h54M628 360h54M628 390h54"/>
    </g>

    <!-- the sea (right) and the beach -->
    <path d="M760 430c240-8 470-6 706 4v80c-230-6-470-8-706-4z" fill="url(#sea)" opacity=".9"/>
    <path d="M800 456h180M1040 470h210M1290 452h140M900 490h160" stroke="#e7eef0" stroke-width="3" opacity=".9"/>
    <path d="M720 500c250-8 500-4 746 10v60H760z" fill="#ead9b4"/>

    <!-- La Mano (Los Dedos) on Playa Brava -->
    <g fill="#e8e1d6" stroke="#b9ad99" stroke-width="2.5">
      <path d="M1180 520c-4-40-2-80 4-104 6-10 16-8 18 2 4 28 4 66 2 102z"/>
      <path d="M1226 522c-2-52 2-104 10-132 6-10 18-8 18 4 2 36 0 88-6 128z"/>
      <path d="M1278 524c0-50 6-96 14-122 6-10 18-6 18 6 0 34-4 80-10 116z"/>
      <path d="M1326 526c4-34 10-64 20-82 6-8 16-4 15 6-4 24-8 50-12 76z"/>
      <path d="M1130 524c-10-26-24-46-36-58-8-6-4-18 6-16 18 6 38 34 50 72z"/>
    </g>
    <ellipse cx="1240" cy="530" rx="150" ry="10" fill="#d9c49a" opacity=".7"/>

    <!-- maritime pines -->
    <g>
      <path d="M140 600c2-60 6-120 4-170M1430 600c-2-60-2-110 0-150" stroke="#7d6550" stroke-width="10" fill="none"/>
      <g fill="#7f9a62" opacity=".9"><ellipse cx="150" cy="420" rx="120" ry="44"/><ellipse cx="120" cy="380" rx="80" ry="30"/><ellipse cx="1425" cy="440" rx="95" ry="38"/></g>
      <g fill="#97ae73" opacity=".85"><ellipse cx="190" cy="402" rx="70" ry="24"/><ellipse cx="1400" cy="420" rx="60" ry="22"/></g>
    </g>

    <!-- ground: grass verge (left) and sand (right) -->
    <path d="M70 470c180-6 380-8 620-6L420 752H70z" fill="#c4cf98" opacity=".8"/>
    <path d="M760 560c240 10 470 20 706 40v152H1010z" fill="#e3d2aa" opacity=".9"/>

    <!-- road in diagonal, from lower left to upper right, like the hero -->
    <path d="M300 752 1040 470h120L760 752z" fill="#d6cec0"/>
    <path d="M530 752 1100 470" stroke="#f0eee6" stroke-width="5" stroke-dasharray="30 26"/>
    <path d="M300 752 1040 470M760 752 1160 470" stroke="#c2b8a6" stroke-width="3"/>

    <!-- classic yellow beetle with Truly ears and red round nose -->
    <g transform="translate(640 548)">
      <ellipse cx="120" cy="150" rx="140" ry="14" fill="#c9bfae" opacity=".7"/>
      <circle cx="78" cy="10" r="20" fill="#2c2c2c"/><circle cx="132" cy="10" r="20" fill="#2c2c2c"/>
      <path d="M8 120c0-40 20-62 52-74 26-30 70-34 102-10 28 10 48 34 54 70l6 18c2 10-4 16-14 16H22c-10 0-16-8-14-20z" fill="#f2cf3a" stroke="#c9a524" stroke-width="3"/>
      <path d="M72 56c18-18 52-20 74-4l10 24H64z" fill="#3e4a4f" stroke="#c9a524" stroke-width="2"/>
      <path d="M108 54v22" stroke="#c9a524" stroke-width="3"/>
      <circle cx="58" cy="132" r="22" fill="#3a3a3a"/><circle cx="58" cy="132" r="9" fill="#d8d8d0"/>
      <circle cx="186" cy="132" r="22" fill="#3a3a3a"/><circle cx="186" cy="132" r="9" fill="#d8d8d0"/>
      <ellipse cx="212" cy="98" rx="10" ry="12" fill="#fff8d8" stroke="#c9a524" stroke-width="2"/>
      <circle cx="228" cy="110" r="10" fill="#d9282e"/>
      <path d="M14 112h220" stroke="#e0e0d8" stroke-width="4"/>
    </g>
  </g>
  <rect width="1536" height="768" filter="url(#paper)"/>
  <rect width="1536" height="768" fill="url(#fade)"/>
</svg>
